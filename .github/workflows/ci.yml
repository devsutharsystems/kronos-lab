name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tests and scripts/build_readme.py look commits up by subject
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install (no torch)
        run: python -m pip install -r requirements-dev.txt
      - name: Python tests
        run: pytest -q
      - name: Committed site data equals results/final/results.json and is not synthetic
        run: pytest -q tests/test_site.py -k "real_site_json_equals_results_json_exactly or tracked_site_json_must_not_be_synthetic"
      - name: Node tests
        run: node --test tests/node/game.test.js tests/node/svg.test.js tests/node/notes.test.js tests/node/plot.test.js tests/node/chips.test.js tests/node/pages.test.js
